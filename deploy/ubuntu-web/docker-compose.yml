services:
  abi-conspector-nginx:
    image: nginx:1.27-alpine
    container_name: abi-conspector-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CONSPECTOR_WEB_ROOT:-/opt/abi_conspector/web}:/usr/share/nginx/html:ro

